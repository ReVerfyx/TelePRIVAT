name: resolver-ci

on:
  push:
    paths:
      - "telegram-resolver/**"
      - ".github/workflows/resolver-ci.yml"
  pull_request:
    paths:
      - "telegram-resolver/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - working-directory: telegram-resolver
        run: mvn -B -DskipTests package
      - run: docker build -t teleprivat-telegram-resolver ./telegram-resolver
